name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. Build & Push
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/crypto-test:${{ github.sha }}
            ghcr.io/${{ secrets.GHCR_USERNAME }}/crypto-test:latest

  # 2. Lint & Quality checks
  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run ESLint
        run: |
          npm install
          npm run lint

  # 3. Tests
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Run frontend tests
        run: |
          docker run --rm ghcr.io/${{ secrets.GHCR_USERNAME }}/crypto-test:${{ github.sha }} npm test
          
  # 4. Security Scan
  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ secrets.GHCR_USERNAME }}/crypto-test:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true

  # 5. Mise à jour du repo infra (GitOps)
  update-infra:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v3
        with:
          repository: Ryan44c8/infra_prog_crypto
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      - name: Mettre à jour le manifest avec le nouveau tag
        run: |
          sed -i "s|ghcr.io.*/crypto-test:.*|ghcr.io/${{ secrets.GHCR_USERNAME }}/crypto-test:${{ github.sha }}|g" frontend.yaml

      - name: Commit et push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add frontend.yaml
          git commit -m "Update crypto-test image to ${{ github.sha }}" || echo "No changes to commit"
          git push origin main
