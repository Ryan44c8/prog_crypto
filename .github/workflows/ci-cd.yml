name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. Lint & Quality checks
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: npm ci
      - run: npm run lint

  # 2. Tests hors conteneur
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - run: npm ci
      - run: npm test

  # 3. Build & Push image (seulement si lint + tests passent)
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/crypto-test:${{ github.sha }}
            ghcr.io/${{ secrets.GHCR_USERNAME }}/crypto-test:latest

  # 4. Security Scan
  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ secrets.GHCR_USERNAME }}/crypto-test:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true

  # 5. Mise à jour du repo infra (GitOps)
  update-infra:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v3
        with:
          repository: Ryan44c8/infra_prog_crypto
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      - name: Mettre à jour le manifest avec le nouveau tag
        run: |
          sed -i "s|ghcr.io.*/crypto-test:.*|ghcr.io/${{ secrets.GHCR_USERNAME }}/crypto-test:${{ github.sha }}|g" frontend.yaml

      - name: Commit et push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add frontend.yaml
          git commit -m "Update crypto-test image to ${{ github.sha }}" || echo "No changes to commit"
          git push origin main
