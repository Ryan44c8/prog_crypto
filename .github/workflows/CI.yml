name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: ghcr.io/${{ secrets.GHCR_USERNAME }}/crypto-test

jobs:
  # 1. Lint (qualité du code)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # 2. Tests unitaires hors conteneur
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

  # 3. Build & Push image (seulement si lint + tests passent)
  build:
    runs-on: ubuntu-latest
    needs: [lint, tests]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. Security Scan (bloquant sur vulnérabilités critiques/hautes)
  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  # 5. Mise à jour du repo infra (GitOps) — uniquement si le scan passe
  update-infra:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: Ryan44c8/infra_prog_crypto
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      - name: Mettre à jour le manifest avec le nouveau tag
        run: |
          sed -i "s|${{ env.IMAGE_NAME }}:.*|${{ env.IMAGE_NAME }}:${{ github.sha }}|g" frontend.yaml

      - name: Commit et push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add frontend.yaml
          git commit -m "chore: update crypto-test image to ${{ github.sha }}" || echo "No changes to commit"
          git push origin main